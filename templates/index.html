<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi hermosa Alisson ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* Mismos estilos generales que el login */
        body, html {
            margin: 0; padding: 0; height: 100%; font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #ffc3a0, #ffafbd);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        .heart-bg { position: absolute; color: rgba(255, 255, 255, 0.4); animation: floatUp linear infinite; z-index: 0; }
        @keyframes floatUp { 0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 1; } 100% { transform: translateY(-10vh) scale(1.5) rotate(360deg); opacity: 0; } }

        .glass-card {
            background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 30px;
            box-shadow: 0 8px 32px 0 rgba(255, 105, 135, 0.3); padding: 40px;
            text-align: center; width: 90%; max-width: 500px; z-index: 10;
        }

        /* ESTILOS PARA LAS 2 FOTOS NUEVAS */
        .fotos-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0 5px 0;
        }
        .foto-amor {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
            transition: transform 0.3s ease;
        }
        .foto-amor:hover {
            transform: scale(1.1) rotate(5deg);
        }
        
        h2 { font-family: 'Dancing Script', cursive; font-size: 42px; color: #d6336c; margin-top: 0; margin-bottom: 5px; text-shadow: 2px 2px 4px rgba(255,255,255,0.5); }
        .subtitle { color: #666; margin-bottom: 10px; font-size: 16px; }
        
        .btn {
            background: linear-gradient(45deg, #ff7eb3, #ff758c); color: white; border: none;
            padding: 15px 30px; font-size: 18px; font-weight: 600; border-radius: 50px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4); transition: transform 0.2s, box-shadow 0.2s;
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            font-family: 'Poppins', sans-serif; margin-top: 20px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 117, 140, 0.6); }

        .mensaje-texto {
            font-family: 'Dancing Script', cursive; font-size: 32px; color: #a61e4d;
            line-height: 1.4; min-height: 150px; display: flex; align-items: center; justify-content: center;
            margin: 20px 0; opacity: 1; transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out;
        }
        .fade-out { opacity: 0; transform: scale(0.95); }
    </style>
</head>
<body>
    <div id="heart-container"></div>
    <div class="glass-card">
        <h2>Hola mi amor ❤️</h2>
        <p class="subtitle">Presiona el botón para descubrir lo que siento por ti.</p>
        
        <!-- LAS DOS FOTOS ESTÁN AQUÍ -->
        <div class="fotos-container">
            <img src="{{ url_for('static', filename='foto_dentro_1.jpeg') }}" alt="Foto 1" class="foto-amor">
            <img src="{{ url_for('static', filename='foto_dentro_2.png') }}" alt="Foto 2" class="foto-amor">
        </div>

        <div class="mensaje-texto" id="contenedor-mensaje">
            ¡Estoy tan feliz de tenerte en mi vida!
        </div>
        
        <button class="btn" onclick="descubrirMensaje()">
            <span>Siguiente mensaje</span> 💖
        </button>
    </div>

    <script>
        function descubrirMensaje() {
            const contenedor = document.getElementById('contenedor-mensaje');
            contenedor.classList.add('fade-out'); // Inicia animación de desvanecimiento
            
            // Llama a Flask para pedir una frase
            fetch('/obtener_frase')
                .then(response => response.json())
                .then(data => {
                    setTimeout(() => {
                        contenedor.innerText = data.frase;
                        contenedor.classList.remove('fade-out'); // Muestra la nueva frase
                    }, 600); // Espera a que termine la animación
                })
                .catch(error => console.error('Error:', error));
        }

        // Ejecutar un mensaje apenas entra a la página
        window.addEventListener('DOMContentLoaded', (event) => {
            descubrirMensaje();
        });

        function crearCorazones() {
            const container = document.getElementById('heart-container');
            const corazones = ['❤️', '💖', '💕', '✨', '🌸'];
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart-bg');
                heart.innerText = corazones[Math.floor(Math.random() * corazones.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
                heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
                container.appendChild(heart);
                setTimeout(() => { heart.remove(); }, 10000);
            }, 400);
        }
        window.onload = crearCorazones;
    </script>
</body>
</html>
